<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pump.fun Scanner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d0f;--surface:#16161a;--card:#1e1e24;--border:#2a2a32;--text:#f0f0f0;--muted:#888;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--accent:#7c5cfc}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;background:#1a2a1a;color:var(--green);border:1px solid #2a4a2a}
.pill.warn{background:#2a1a1a;color:var(--red);border-color:#4a2a2a}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-bottom:1px solid var(--border)}
.stat{padding:10px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat .n{font-size:18px;font-weight:700}
.stat .l{font-size:10px;color:var(--muted);margin-top:2px}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.filters{display:flex;gap:6px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.fbtn{white-space:nowrap;padding:4px 12px;border-radius:20px;font-size:11px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--muted)}
.fbtn.on{background:#1a1040;color:#a78bfa;border-color:#4c3a8c}
.feed{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer}
.card.hot{border-color:#16a34a}
.card.watch{border-color:#d97706}
.ctop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cimg{width:36px;height:36px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.cinfo{flex:1;min-width:0}
.cinfo strong{display:block;font-size:13px;font-weight:700}
.cinfo span{font-size:11px;color:var(--muted)}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.hot-b{background:#14532d;color:#4ade80}
.watch-b{background:#451a03;color:#fbbf24}
.weak-b{background:#1c1c24;color:#666}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.metric{background:var(--surface);border-radius:6px;padding:6px 8px}
.metric .ml{font-size:10px;color:var(--muted)}
.metric .mv{font-size:12px;font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chk{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:500}
.pass{background:#14532d;color:#4ade80}
.fail{background:#450a0a;color:#f87171}
.actions{display:flex;gap:6px}
.abtn{flex:1;padding:7px 4px;border-radius:8px;font-size:10px;font-weight:600;border:1px solid var(--border);background:none;color:var(--text);text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.abtn-buy{background:#16a34a;color:#fff;border-color:#16a34a}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.green{color:var(--green)}.red{color:var(--red)}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><span class="dot" id="dot"></span>🚀 Pump.fun Scanner</div>
  <span
